<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" aria-label="JT-PROXENSE">
  <defs>
    <linearGradient id="jtp-core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5cf6ff"/>
      <stop offset="100%" stop-color="#00aacc"/>
    </linearGradient>
  </defs>
  <!-- single bold hexagon ring with a faint inner wash -->
  <path d="M32 5 L54 18 L54 38 L32 51 L10 38 L10 18 Z"
        stroke="#00f0ff" stroke-width="2.4" stroke-linejoin="round"
        fill="#00f0ff" fill-opacity="0.06"/>
  <!-- bold ascending chevron core -->
  <path d="M20 38 L32 24 L44 38" stroke="url(#jtp-core)" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- bright core node -->
  <circle cx="32" cy="42" r="2.6" fill="#eafdff"/>
</svg>
