<style>
  :root { --bg: #04070d; --cyan: #00d8ef; --text: #e8fbff; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Share Tech Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 20px; border-bottom: 1px solid rgba(0, 216, 239, .18);
    flex: none;
  }
  header a.brand {
    display: flex; align-items: center; gap: 10px;
    color: var(--text); text-decoration: none; letter-spacing: .12em;
    font-size: 15px;
  }
  header .ver {
    padding: 2px 8px; border: 1px solid rgba(0, 216, 239, .45);
    border-radius: 3px; color: var(--cyan); font-size: 11px;
  }
  header .spacer { flex: 1; }
  header a.back {
    color: var(--cyan); text-decoration: none; font-size: 13px;
    padding: 6px 12px; border: 1px solid rgba(0, 216, 239, .35); border-radius: 3px;
  }
  header a.back:hover { background: rgba(0, 216, 239, .1); }

  /* The video is the page. Let it take whatever is left and stay whole —
     object-fit: contain rather than cover, because cropping a UI demo cuts
     off the very panels it is meant to show. */
  main {
    flex: 1; min-height: 0; display: flex;
    align-items: center; justify-content: center; padding: 16px;
  }
  video {
    width: 100%; height: 100%; max-width: 100%; max-height: 100%;
    object-fit: contain; background: #000;
    border: 1px solid rgba(0, 216, 239, .2); border-radius: 6px;
  }
  footer {
    flex: none; padding: 10px 20px 16px; text-align: center;
    font-size: 12px; color: rgba(232, 251, 255, .55);
  }
  footer a { color: rgba(0, 216, 239, .8); }
  @media (max-width: 640px) {
    header { padding: 10px 14px; }
    header a.brand { font-size: 13px; }
    main { padding: 8px; }
  }
</style>
