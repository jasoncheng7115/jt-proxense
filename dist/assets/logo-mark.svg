      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0080a8" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="jtp-mark-glow" x="-30%" y="-30%" width="160%" height="160%">
