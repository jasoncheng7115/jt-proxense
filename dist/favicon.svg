<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="cyber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f0ff"/>
      <stop offset="100%" style="stop-color:#bf00ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <!-- Outer hexagon -->
    <polygon points="50,5 90,27.5 90,72.5 50,95 10,72.5 10,27.5"
             fill="none" stroke="url(#cyber)" stroke-width="3"/>
    <!-- Inner circle -->
    <circle cx="50" cy="50" r="25" fill="none" stroke="#00f0ff" stroke-width="2"/>
    <!-- Center dot -->
    <circle cx="50" cy="50" r="8" fill="#00f0ff"/>
    <!-- Decorative lines -->
    <line x1="50" y1="25" x2="50" y2="15" stroke="#00f0ff" stroke-width="2"/>
    <line x1="50" y1="75" x2="50" y2="85" stroke="#00f0ff" stroke-width="2"/>
    <line x1="25" y1="50" x2="15" y2="50" stroke="#00f0ff" stroke-width="2"/>
    <line x1="75" y1="50" x2="85" y2="50" stroke="#00f0ff" stroke-width="2"/>
  </g>
</svg>
